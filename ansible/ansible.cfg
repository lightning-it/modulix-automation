[defaults]
collections_path = ./collections:/usr/share/ansible/collections:/usr/share/automation-controller/collections:/runner/collections
roles_path = ./roles:/usr/share/ansible/roles:/runner/roles
lookup_plugins = ./lookup_plugins
vault_password_file = ~/modulix-env/.vault-pass.txt
# Keep remote temp user-scoped on managed hosts so mixed become/become_user
# workflows do not collide on a shared /tmp path.
remote_tmp = ~/.ansible/tmp
stdout_callback = default
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60m -o ControlPath=/tmp/ansible-ssh-%h-%p-%r
pipelining = True

[inventory]
# Inventory path can be overridden via CLI; default structure lives under inventories/
