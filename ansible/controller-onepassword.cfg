# Explicit Linux EE memory-credential profile. No legacy Vault password file.
[defaults]
collections_path = ./collections:/usr/share/ansible/collections:/usr/share/automation-controller/collections:/runner/collections
roles_path = ./roles:/usr/share/ansible/roles:/runner/roles
lookup_plugins = ./lookup_plugins
no_log = True
no_target_syslog = True
display_args_to_stdout = False
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=no -o ForwardAgent=no -o BatchMode=yes -o StrictHostKeyChecking=yes
