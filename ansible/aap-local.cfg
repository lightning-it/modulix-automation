[defaults]
collections_path = /runner/project/collections:/usr/share/ansible/collections:/usr/share/automation-controller/collections:/runner/collections
roles_path = /runner/project/roles:/usr/share/ansible/roles:/runner/roles
lookup_plugins = ./lookup_plugins
remote_tmp = ~/.ansible/tmp
stdout_callback = default
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60m -o ControlPath=/tmp/ansible-ssh-%h-%p-%r
pipelining = True

[inventory]
