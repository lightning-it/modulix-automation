---
# The trusted launcher supplies one sealed inherited memory descriptor, never
# credentials in arguments, environment values or plaintext files.
- name: Validate the memory-only controller Vault contract
  ansible.builtin.assert:
    that:
      - _hetzner_vault_controller_auth.schema_version is integer
      - _hetzner_vault_controller_auth.schema_version == 1
      - _hetzner_vault_controller_auth.auth_method == 'approle'
      - _hetzner_vault_controller_auth.onepassword is mapping
      - hetzner_baremetal_vault.validate_certs is sameas true
      - hetzner_baremetal_vault.namespace is string
      - hetzner_baremetal_vault.timeout is integer
      - hetzner_baremetal_vault.timeout >= 1
      - hetzner_baremetal_vault.retries is integer
      - hetzner_baremetal_vault.retries >= 0
      - lookup('ansible.builtin.env', 'VAULT_ADDR') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_TOKEN') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_ROLE_ID') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_SECRET_ID') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_SKIP_VERIFY') | length == 0
    quiet: true
  no_log: true

- name: Validate immutable item identity and exact public CA before connecting
  ansible.builtin.set_fact:
    _hetzner_vault_memory_auth: >-
      {{ lookup('lit_controller_onepassword',
                _hetzner_vault_controller_auth,
                ca_path=hetzner_baremetal_vault.ca_cert_path,
                project_root=lookup('ansible.builtin.env', 'PWD')) }}
  no_log: true

- name: Establish the existing inventory-bound controller Vault SSH tunnel
  ansible.builtin.include_tasks: ensure-hashicorp-vault-ssh-tunnel.yml
  no_log: true

- name: Require the verified HTTPS transport
  ansible.builtin.assert:
    that:
      - _hetzner_vault_ssh_tunnel_ready | default(false) | bool
      - hetzner_baremetal_vault.api_addr is match('^https://[^/]+$')
      - >-
        hetzner_baremetal_vault.api_addr
        == hetzner_baremetal_vault.network.controller_api_addr
    quiet: true
  no_log: true

- name: Publish only the validated scoped controller authentication
  ansible.builtin.set_fact:
    _hetzner_hashicorp_vault_auth:
      url: "{{ hetzner_baremetal_vault.api_addr }}"
      namespace: "{{ hetzner_baremetal_vault.namespace }}"
      validate_certs: true
      ca_cert: "{{ hetzner_baremetal_vault.ca_cert_path }}"
      timeout: "{{ hetzner_baremetal_vault.timeout }}"
      retries: "{{ hetzner_baremetal_vault.retries }}"
      auth_method: approle
      auth_mount_point: "{{ _hetzner_vault_controller_auth.auth_mount_point }}"
      role_id: "{{ _hetzner_vault_memory_auth.role_id }}"
      secret_id: "{{ _hetzner_vault_memory_auth.secret_id }}"
      ca_sha256: "{{ _hetzner_vault_memory_auth.ca_sha256 }}"
      auth_source: onepassword_memory
      auth_item_id: "{{ _hetzner_vault_controller_auth.onepassword.item_id }}"
      auth_item_version: >-
        {{ _hetzner_vault_controller_auth.onepassword.item_version }}
  no_log: true
