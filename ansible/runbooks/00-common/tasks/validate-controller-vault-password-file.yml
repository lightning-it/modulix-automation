---
# Shared by legacy AppRole resolution and database backup custody. No password
# value is logged; bounded nonempty key validation precedes Vault reads/dumps.
- name: Validate the existing protected controller encryption password file
  ansible.builtin.set_fact:
    _hetzner_vault_validated_password_file: >-
      {{ query('lit_controller_vault_password',
               lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE'),
               forbidden_paths=[
                 hetzner_baremetal_vault.ca_cert_path,
                 (hashicorp_vault_controller_auth
                  | default(hetzner_baremetal_vault.controller_auth))
                 .ansible_vault_path | default('')
               ]) | first }}
  no_log: true
