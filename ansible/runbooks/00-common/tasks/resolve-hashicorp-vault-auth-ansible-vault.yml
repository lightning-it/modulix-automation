---
# Resolve the controller's scoped HashiCorp Vault AppRole credential from an
# immutable Ansible Vault document. Callers must keep this include and every
# task consuming the resulting fact under no_log.
- name: Select the requested controller Vault authentication contract
  ansible.builtin.set_fact:
    _hetzner_vault_controller_auth: >-
      {{
        hashicorp_vault_controller_auth
        | default(hetzner_baremetal_vault.controller_auth)
      }}
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Establish the inventory-declared controller Vault SSH tunnel
  ansible.builtin.include_tasks: ensure-hashicorp-vault-ssh-tunnel.yml

- name: Validate the controller HashiCorp Vault authentication contract
  ansible.builtin.assert:
    that:
      - hetzner_baremetal_vault is mapping
      - hetzner_baremetal_vault.api_addr is string
      - hetzner_baremetal_vault.api_addr is match('^https://[^/]+$')
      - >-
        hetzner_baremetal_vault.api_addr
        == hetzner_baremetal_vault.network.controller_api_addr
      - _hetzner_vault_ssh_tunnel_ready | default(false) | bool
      - hetzner_baremetal_vault.validate_certs is sameas true
      - hetzner_baremetal_vault.ca_cert_path is string
      - hetzner_baremetal_vault.ca_cert_path is match('^/')
      - hetzner_baremetal_vault.namespace is string
      - hetzner_baremetal_vault.timeout is integer
      - hetzner_baremetal_vault.timeout | int >= 1
      - hetzner_baremetal_vault.retries is integer
      - hetzner_baremetal_vault.retries | int >= 0
      - _hetzner_vault_controller_auth is mapping
      - >-
        _hetzner_vault_controller_auth.schema_version
        is integer
      - >-
        _hetzner_vault_controller_auth.schema_version | int == 1
      - _hetzner_vault_controller_auth.subject is string
      - >-
        _hetzner_vault_controller_auth.subject
        is match('^[a-z0-9][a-z0-9._-]{2,127}$')
      - _hetzner_vault_controller_auth.auth_method == 'approle'
      - _hetzner_vault_controller_auth.auth_mount_point is string
      - >-
        _hetzner_vault_controller_auth.auth_mount_point
        is match('^[A-Za-z0-9][A-Za-z0-9._/-]*$')
      - >-
        not _hetzner_vault_controller_auth.auth_mount_point
        .startswith('/')
      - >-
        not _hetzner_vault_controller_auth.auth_mount_point
        .endswith('/')
      - >-
        _hetzner_vault_controller_auth.ansible_vault_path is string
      - >-
        _hetzner_vault_controller_auth.ansible_vault_path
        is match('^/')
      - >-
        lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')
        | length > 0
      - lookup('ansible.builtin.env', 'VAULT_ADDR') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_TOKEN') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_SKIP_VERIFY') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_ROLE_ID') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_SECRET_ID') | length == 0
    fail_msg: >-
      The controller Vault contract must use the exact HTTPS API endpoint,
      certificate validation, a protected AppRole document, and no exported
      Vault address or credentials.
    quiet: true
  no_log: true

- name: Resolve canonical controller Vault paths
  ansible.builtin.set_fact:
    _hetzner_vault_auth_secrets_root_expected: >-
      {{ (lookup('ansible.builtin.env', 'PWD') ~ '/.secrets') | normpath }}
    _hetzner_vault_auth_secrets_root_canonical: >-
      {{ (lookup('ansible.builtin.env', 'PWD') ~ '/.secrets') | realpath }}
    _hetzner_vault_auth_document_path_normalized: >-
      {{ _hetzner_vault_controller_auth.ansible_vault_path | normpath }}
    _hetzner_vault_auth_document_path_canonical: >-
      {{ _hetzner_vault_controller_auth.ansible_vault_path | realpath }}
    _hetzner_vault_auth_ca_path_normalized: >-
      {{ hetzner_baremetal_vault.ca_cert_path | normpath }}
    _hetzner_vault_auth_ca_path_canonical: >-
      {{ hetzner_baremetal_vault.ca_cert_path | realpath }}
    _hetzner_vault_auth_password_path_normalized: >-
      {{
        lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')
        | normpath
      }}
    _hetzner_vault_auth_password_path_canonical: >-
      {{
        lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')
        | realpath
      }}
    _hetzner_vault_auth_controller_uid: >-
      {{ lookup('ansible.builtin.pipe', 'id -u') | int }}
  no_log: true

- name: Require controller Vault material below the project secrets root
  ansible.builtin.assert:
    that:
      - _hetzner_vault_auth_secrets_root_expected is match('^/')
      - _hetzner_vault_auth_secrets_root_expected | length > 1
      - >-
        _hetzner_vault_auth_secrets_root_canonical
        == _hetzner_vault_auth_secrets_root_expected
      - _hetzner_vault_auth_document_path_normalized is match('^/')
      - _hetzner_vault_auth_ca_path_normalized is match('^/')
      - _hetzner_vault_auth_password_path_normalized is match('^/')
      - >-
        _hetzner_vault_controller_auth.ansible_vault_path
        == _hetzner_vault_auth_document_path_normalized
      - >-
        _hetzner_vault_auth_document_path_canonical
        == _hetzner_vault_auth_document_path_normalized
      - >-
        hetzner_baremetal_vault.ca_cert_path
        == _hetzner_vault_auth_ca_path_normalized
      - >-
        _hetzner_vault_auth_ca_path_canonical
        == _hetzner_vault_auth_ca_path_normalized
      - >-
        lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')
        == _hetzner_vault_auth_password_path_normalized
      - >-
        _hetzner_vault_auth_password_path_canonical
        == _hetzner_vault_auth_password_path_normalized
      - >-
        _hetzner_vault_auth_document_path_canonical
        != _hetzner_vault_auth_secrets_root_canonical
      - >-
        _hetzner_vault_auth_document_path_canonical.startswith(
          _hetzner_vault_auth_secrets_root_canonical ~ '/'
        )
      - >-
        _hetzner_vault_auth_ca_path_canonical
        != _hetzner_vault_auth_secrets_root_canonical
      - >-
        _hetzner_vault_auth_ca_path_canonical.startswith(
          _hetzner_vault_auth_secrets_root_canonical ~ '/'
        )
      - >-
        _hetzner_vault_auth_document_path_canonical
        != _hetzner_vault_auth_ca_path_canonical
      - >-
        _hetzner_vault_auth_password_path_canonical
        != _hetzner_vault_auth_document_path_canonical
      - >-
        _hetzner_vault_auth_password_path_canonical
        != _hetzner_vault_auth_ca_path_canonical
    fail_msg: >-
      The controller AppRole ciphertext and exact CA bundle must be separate
      canonical files below the workspace .secrets directory; the Ansible
      Vault password path must also be absolute, canonical, and distinct.
    quiet: true
  no_log: true

- name: Resolve protected controller Vault parent paths
  ansible.builtin.set_fact:
    _hetzner_vault_auth_parent_paths: >-
      {%- set parents = namespace(paths=['/']) -%}
      {%- for candidate in [
        _hetzner_vault_auth_secrets_root_canonical,
        _hetzner_vault_auth_document_path_canonical | dirname,
        _hetzner_vault_auth_ca_path_canonical | dirname,
        _hetzner_vault_auth_password_path_canonical | dirname
      ] -%}
        {%- set current = namespace(path='') -%}
        {%- for component in candidate.split('/') -%}
          {%- if component | length > 0 -%}
            {%- set current.path = current.path ~ '/' ~ component -%}
            {%- if current.path not in parents.paths -%}
              {%- set parents.paths = parents.paths + [current.path] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ parents.paths }}
  no_log: true

- name: Inspect protected controller Vault parent paths
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    follow: false
  loop: "{{ _hetzner_vault_auth_parent_paths }}"
  delegate_to: localhost
  become: false
  register: _hetzner_vault_auth_parent_stats
  changed_when: false
  no_log: true

- name: Require protected controller Vault parent paths
  ansible.builtin.assert:
    that:
      - >-
        _hetzner_vault_auth_parent_stats.results | length
        == _hetzner_vault_auth_parent_paths | length
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
      - item.stat.executable | default(false)
      - not (item.stat.islnk | default(false))
      - >-
        item.stat.uid | default(-1) | int
        in [0, _hetzner_vault_auth_controller_uid | int]
      - >-
        (
          item.stat.mode | default('')
          is match('^[0-7][0-7][0145][0145]$')
        )
        or (
          item.stat.uid | default(-1) | int == 0
          and item.stat.gid | default(-1) | int == 0
          and (
            item.stat.mode | default('')
            is match('^[0-7][0-7][0-7][0145]$')
          )
        )
        or (
          item.item == '/tmp'
          and item.stat.uid | default(-1) | int == 0
          and item.stat.gid | default(-1) | int == 0
          and item.stat.mode | default('') == '1777'
        )
    fail_msg: >-
      Every controller directory leading to Vault authentication material
      must be a traversable, symlink-free directory owned by root or the
      controller user. Group write is accepted only for root:root directories
      without world write; the exact root-owned sticky /tmp is also accepted.
    quiet: true
  loop: "{{ _hetzner_vault_auth_parent_stats.results }}"
  no_log: true

- name: Check protected controller Vault inputs
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: "{{ item.checksum }}"
    checksum_algorithm: sha256
    follow: false
  loop:
    - path: "{{ _hetzner_vault_auth_document_path_canonical }}"
      checksum: true
    - path: "{{ _hetzner_vault_auth_ca_path_canonical }}"
      checksum: true
    - path: "{{ _hetzner_vault_auth_password_path_canonical }}"
      checksum: false
  delegate_to: localhost
  become: false
  register: _hetzner_vault_auth_files
  changed_when: false
  no_log: true

- name: Require all controller Vault inputs to be inspected
  ansible.builtin.assert:
    that:
      - _hetzner_vault_auth_files.results | length == 3
    fail_msg: >-
      The controller AppRole document, CA bundle, and Ansible Vault password
      file must all be inspected.
    quiet: true
  no_log: true

- name: Require protected regular controller Vault inputs
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - item.stat.readable | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.nlink | default(0) | int == 1
      - item.stat.uid | default(-1) | int in [0, _hetzner_vault_auth_controller_uid | int]
      - item.stat.size | default(0) | int > 0
      - item.stat.size | default(0) | int <= 1048576
    fail_msg: >-
      Every controller Vault input must be a non-empty, single-link regular
      file no larger than 1 MiB and owned by root or the controller user.
    quiet: true
  loop: "{{ _hetzner_vault_auth_files.results }}"
  no_log: true

- name: Require owner-only AppRole ciphertext and Vault password files
  ansible.builtin.assert:
    that:
      - item.stat.mode | default('') in ['0400', '0600']
    fail_msg: >-
      The controller AppRole ciphertext and Ansible Vault password file must
      use owner-only mode 0400 or 0600.
    quiet: true
  loop:
    - "{{ _hetzner_vault_auth_files.results[0] }}"
    - "{{ _hetzner_vault_auth_files.results[2] }}"
  no_log: true

- name: Require a protected exact CA bundle
  ansible.builtin.assert:
    that:
      - >-
        _hetzner_vault_auth_files.results[1].stat.mode
        | default('') in ['0400', '0444', '0600', '0644']
      - >-
        _hetzner_vault_auth_files.results[1].stat.checksum
        | default('') is match('^[0-9a-f]{64}$')
    fail_msg: >-
      The exact Vault CA bundle must be a protected readable file with a valid
      SHA-256 identity.
    quiet: true
  no_log: true

- name: Read only the AppRole ciphertext signature
  ansible.builtin.command:
    argv:
      - head
      - -c
      - "15"
      - "{{ _hetzner_vault_auth_document_path_canonical }}"
  delegate_to: localhost
  become: false
  register: _hetzner_vault_auth_ciphertext_signature
  changed_when: false
  check_mode: false
  no_log: true

- name: Reject a plaintext controller AppRole document
  ansible.builtin.assert:
    that:
      - _hetzner_vault_auth_ciphertext_signature.stdout == '$ANSIBLE_VAULT;'
    fail_msg: "The controller AppRole document is not Ansible Vault ciphertext."
    quiet: true
  no_log: true

- name: Validate the exact controller Vault CA bundle
  ansible.builtin.command:
    argv:
      - openssl
      - crl2pkcs7
      - -nocrl
      - -certfile
      - "{{ _hetzner_vault_auth_ca_path_canonical }}"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Decrypt the controller AppRole document
  ansible.builtin.include_vars:
    file: "{{ _hetzner_vault_auth_document_path_canonical }}"
    name: _hetzner_vault_auth_document
  no_log: true

- name: Validate the exact controller AppRole document
  ansible.builtin.assert:
    that:
      - _hetzner_vault_auth_document is mapping
      - >-
        _hetzner_vault_auth_document.keys() | list | sort
        == ['auth_method', 'role_id', 'schema_version', 'secret_id', 'subject']
      - _hetzner_vault_auth_document.schema_version is integer
      - >-
        _hetzner_vault_auth_document.schema_version
        == _hetzner_vault_controller_auth.schema_version
      - _hetzner_vault_auth_document.subject is string
      - >-
        _hetzner_vault_auth_document.subject
        == _hetzner_vault_controller_auth.subject
      - _hetzner_vault_auth_document.auth_method == 'approle'
      - _hetzner_vault_auth_document.role_id is string
      - >-
        _hetzner_vault_auth_document.role_id
        is match('^[^\\r\\n]{16,4096}$')
      - _hetzner_vault_auth_document.secret_id is string
      - >-
        _hetzner_vault_auth_document.secret_id
        is match('^[^\\r\\n]{16,4096}$')
    fail_msg: >-
      The controller AppRole ciphertext has an invalid schema, subject,
      authentication method, Role ID, or Secret ID.
    quiet: true
  no_log: true

- name: Resolve explicit controller HashiCorp Vault module arguments
  ansible.builtin.set_fact:
    _hetzner_hashicorp_vault_auth:
      url: "{{ hetzner_baremetal_vault.api_addr }}"
      namespace: "{{ hetzner_baremetal_vault.namespace }}"
      validate_certs: true
      ca_cert: "{{ _hetzner_vault_auth_ca_path_canonical }}"
      timeout: "{{ hetzner_baremetal_vault.timeout | int }}"
      retries: "{{ hetzner_baremetal_vault.retries | int }}"
      auth_method: approle
      auth_mount_point: >-
        {{ _hetzner_vault_controller_auth.auth_mount_point }}
      role_id: "{{ _hetzner_vault_auth_document.role_id }}"
      secret_id: "{{ _hetzner_vault_auth_document.secret_id }}"
      ca_sha256: >-
        {{ _hetzner_vault_auth_files.results[1].stat.checksum }}
      auth_ciphertext_sha256: >-
        {{ _hetzner_vault_auth_files.results[0].stat.checksum }}
  no_log: true
