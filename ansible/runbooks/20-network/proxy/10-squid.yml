---
- name: Validate one explicit forward-proxy target
  hosts: "all:localhost"
  connection: local
  become: false
  gather_facts: false
  any_errors_fatal: true
  vars:
    forward_proxy_target_host_effective: >-
      {{ forward_proxy_target_host | default('') | string | trim }}
    forward_proxy_limit_hosts: >-
      {{
        ansible_limit | default('') | string
        | split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  tasks:
    - name: Require a limit-safe forward-proxy target
      ansible.builtin.assert:
        that:
          - >-
            forward_proxy_orchestration_action | default('plan')
            in ['plan', 'apply']
          - forward_proxy_target_host is defined
          - forward_proxy_target_host_effective | length > 0
          - >-
            forward_proxy_target_host_effective
            in groups.get('forward_proxies', [])
          - ansible_limit is defined
          - forward_proxy_limit_hosts | length == 2
          - forward_proxy_limit_hosts | unique | list | length == 2
          - >-
            forward_proxy_limit_hosts | difference(
              ['localhost', forward_proxy_target_host_effective]
            ) | length == 0
          - >-
            ['localhost', forward_proxy_target_host_effective]
            | difference(forward_proxy_limit_hosts) | length == 0
        fail_msg: >-
          Forward-proxy execution requires -e forward_proxy_target_host=<FQDN>
          and --limit localhost,<FQDN>; the FQDN must exist in the
          forward_proxies inventory group.
        quiet: true
      changed_when: false
      delegate_to: localhost
      run_once: true
      tags: [always]

- name: Configure the standard LIT forward proxy
  hosts: forward_proxies
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Require an explicit single-host proxy execution boundary
      ansible.builtin.assert:
        that:
          - >-
            forward_proxy_orchestration_action | default('plan')
            in ['plan', 'apply']
          - >-
            forward_proxy_target_host | default('') | string | trim
            == inventory_hostname
          - ansible_limit is defined
          - >-
            ansible_limit | string | split(',') | map('trim') | list | sort
            == ['localhost', inventory_hostname] | sort
          - ansible_play_hosts_all | length == 1
          - ansible_play_hosts_all == [inventory_hostname]
        fail_msg: >-
          Forward-proxy execution requires the preflight-approved inventory
          FQDN, --limit localhost,<FQDN>, and an explicit plan or apply action.
        quiet: true
      changed_when: false
      tags: [always]

    - name: End after the read-only proxy plan
      ansible.builtin.meta: end_play
      when: forward_proxy_orchestration_action | default('plan') == 'plan'
      tags: [always]

  roles:
    - name: Run the distribution-neutral closed forward proxy service
      role: lit.supplementary.forward_proxy
      forward_proxy_enabled: true
      tags:
        - forward_proxy
    - name: Configure Ubuntu forward proxy clients
      role: lit.ubuntu.forward_proxy_client
      forward_proxy_client_enabled: true
      tags:
        - forward_proxy
...
