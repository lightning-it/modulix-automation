# yamllint disable rule:truthy
---
name: Wunderbox governed execution CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governed-execution-contract:
    name: Governed execution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: &controller_ee >-
        quay.io/l-it/ee-wunder-devtools-ubi9@sha256:82e9586f082f8818aba9e8c12b4cab696dda31b025bf561e7e9fdfd1037e7d25
      options: --user 0:0
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false

      - name: Validate executable syntax and format
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ansible/callback_plugins/lit_governed_evidence.py \
            ansible/scripts/runtime-collection-provenance.py \
            scripts/governed-ansible-exec.py \
            scripts/render-wbx-gate-manifest-template.py \
            scripts/wbx-governed-exec.py \
            tests/test_governed_ansible_exec.py \
            tests/test_governed_runtime_support.py \
            tests/test_wbx_governed_execution_ci.py \
            tests/test_wbx_governed_execution_policy.py
          bash -n \
            ansible/scripts/ansible-nav \
            ansible/scripts/ansible-nav-local \
            ansible/scripts/governed-ansible-root-launcher \
            ansible/tests/test_ansible_nav.sh \
            ansible/tests/test_ansible_nav_local.sh
          black --check \
            tests/test_governed_runtime_support.py \
            tests/test_wbx_governed_execution_ci.py
          shellcheck \
            ansible/scripts/ansible-nav \
            ansible/scripts/ansible-nav-local \
            ansible/scripts/governed-ansible-root-launcher \
            ansible/tests/test_ansible_nav.sh \
            ansible/tests/test_ansible_nav_local.sh
          yamllint .github/workflows/wbx-governed-execution-ci.yml

      - name: Run governed recorder and policy contracts
        shell: bash
        run: |
          set -euo pipefail
          private_tmp="$(mktemp -d /root/governed-tests.XXXXXX)"
          export TMPDIR="$private_tmp"
          /usr/bin/python3.11 tests/test_governed_ansible_exec.py
          python3 tests/test_governed_runtime_support.py
          /usr/bin/python3.11 tests/test_wbx_governed_execution_policy.py
          python3 tests/test_wbx_governed_execution_ci.py

          python3 -m unittest discover -s ansible/tests/wunderbox -v
          black --check ansible/lookup_plugins/lit_controller_onepassword.py \
            ansible/runbooks/50-applications/wunderbox/action_plugins/lit_encrypted_backup.py \
            ansible/runbooks/50-applications/wunderbox/library/lit_bounded_slurp.py \
            ansible/lookup_plugins/lit_controller_vault_password.py \
            ansible/tests/controller_onepassword_oci_fixture.py \
            ansible/tests/wunderbox/test_controller_onepassword.py \
            ansible/tests/wunderbox/test_controller_vault_password.py
          shellcheck ansible/tests/test_controller_onepassword_oci.sh
          yamllint ansible/runbooks/00-common/tasks/resolve-hashicorp-vault-auth*.yml

      - name: Run execution wrapper contracts
        shell: bash
        run: |
          set -euo pipefail
          ansible/tests/test_ansible_nav.sh
          ansible/tests/test_ansible_nav_local.sh

  controller-memory-namespace:
    name: Controller memory namespace lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CONTROLLER_EE_IMAGE: *controller_ee
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
        with:
          persist-credentials: false
      - name: Test real namespace exit and interruption with synthetic credentials
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$CONTROLLER_EE_IMAGE"
          bash ansible/tests/test_controller_onepassword_oci.sh docker
